[package]
name = "one-os-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Experimental x86_64 bare-metal kernel for ONE OS"

[features]
default = []
# Test-only fault injection for the QEMU exception diagnostics checks.
test-exception = []
test-general-protection = []
test-page-fault = []
# Test-only invalid-stack fault injection to exercise the double-fault IST stack.
test-double-fault = []
# Test-only software-vector checks that verify the NMI and machine-check IST stacks.
test-ist = []
# Dedicated hardware memory-protection acceptance images (terminal expected #PF).
test-supervisor-write-protection = []
test-nx-protection = []
# Dedicated map/unmap/remap and page-fault/TLB transition acceptance image.
test-vm-transitions = []
# Dedicated smoke image for uncertain-CR3 root-token leak policy.
test-root-leak-safety = []
# Dedicated QEMU image for full post-activation W^X audit diagnostics.
test-wx-runtime-audit = []
# Dedicated QMP-injected asynchronous NMI test during the W^X non-present window.
test-nmi-wx-transition = []

[dependencies]
bootloader_api = "=0.11.17"
oneos-core = { path = "../crates/oneos-core" }

[[bin]]
name = "one-os-kernel"
path = "src/main.rs"
test = false
bench = false
