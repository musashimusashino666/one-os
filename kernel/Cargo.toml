[package]
name = "one-os-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Experimental x86_64 bare-metal kernel for ONE OS"

[features]
default = []
# Test-only fault injection for the QEMU exception diagnostics checks.
test-exception = []
test-general-protection = []
test-page-fault = []
# Test-only invalid-stack fault injection to exercise the double-fault IST stack.
test-double-fault = []
# Dedicated hardware memory-protection acceptance images (terminal expected #PF).
test-supervisor-write-protection = []
test-nx-protection = []

[dependencies]
bootloader_api = "=0.11.17"
oneos-core = { path = "../crates/oneos-core" }

[[bin]]
name = "one-os-kernel"
path = "src/main.rs"
test = false
bench = false
