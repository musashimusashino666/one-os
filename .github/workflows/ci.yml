name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Normalize push and pull_request events to the same source branch.
  # Include the head repository to avoid collisions between forks with equal branch names.
  group: one-os-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format-and-test:
    name: Format, test, lint, and boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Regression test for custom target directories used by oneos-xtask.
      CARGO_TARGET_DIR: /tmp/one-os-target
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned upstream master snapshot; no matching release tag
        with:
          toolchain: nightly-2026-10-22
          components: rustfmt, clippy, llvm-tools-preview, rust-src
          targets: x86_64-unknown-none

      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y qemu-system-x86

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run core tests
        run: cargo test --locked -p oneos-core

      - name: Lint core crate
        run: cargo clippy --locked -p oneos-core --all-targets -- -D warnings

      - name: Lint bare-metal kernel
        run: cargo clippy --locked -p one-os-kernel --target x86_64-unknown-none -- -D warnings

      - name: Lint build tool
        run: cargo clippy --locked -p oneos-xtask --all-targets -- -D warnings

      - name: Check bare-metal kernel
        run: cargo check --locked -p one-os-kernel --target x86_64-unknown-none

      - name: Build BIOS image
        run: cargo run --locked -p oneos-xtask -- image

      - name: Test QEMU serial-log validator
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Verify kernel startup in QEMU (three independent boots)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "QEMU boot attempt ${attempt}/3"
            log="$CARGO_TARGET_DIR/qemu-serial-${attempt}.log"
            set +e
            timeout 10s qemu-system-x86_64 \
              -drive format=raw,file="$CARGO_TARGET_DIR/one-os-bios.img" \
              -serial stdio -display none -no-reboot -no-shutdown \
              > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            python3 tools/check_qemu_serial.py \
              --log "$log" \
              --exit-status "$status"
          done

      - name: Verify exception diagnostics in QEMU
        shell: bash
        run: |
          verify_exception_case() {
            local command="$1"
            local image="$2"
            local trigger_marker="$3"
            local exception_name="$4"
            local vector="$5"
            local expects_error_code="$6"
            local expected_fault_address="$7"
            local log="$CARGO_TARGET_DIR/"$command".log"

            cargo run --locked -p oneos-xtask -- "$command"
            set +e
            timeout 10s qemu-system-x86_64 \
              -drive format=raw,file="$CARGO_TARGET_DIR/$image" \
              -serial stdio -display none -no-reboot -no-shutdown \
              > "$log" 2>&1
            local status=$?
            set -e
            cat "$log"

            if [ "$status" -ne 124 ]; then
              echo "Expected QEMU to remain halted after $exception_name (timeout status 124); got $status" >&2
              return 1
            fi

            grep -F "$trigger_marker" "$log"
            grep -F "Exception: $exception_name" "$log"
            grep -F "Exception vector: $vector" "$log"
            grep -F "Instruction pointer: 0x" "$log"
            grep -F "ONE OS EXCEPTION HALTED" "$log"
            if [ "$expects_error_code" = "yes" ]; then
              grep -F "Error code: 0x" "$log"
            fi
            if [ -n "$expected_fault_address" ]; then
              grep -F "Fault address (CR2): $expected_fault_address" "$log"
            fi

            if grep -Fq "ONE OS BOOTSTRAP COMPLETE" "$log"; then
              echo "Fault-injection image incorrectly reported successful bootstrap" >&2
              return 1
            fi
            if grep -Fq "ONE OS KERNEL PANIC" "$log"; then
              echo "Exception test unexpectedly entered the Rust panic handler" >&2
              return 1
            fi
          }

          verify_exception_case \
            image-test-exception \
            one-os-exception-test-bios.img \
            "ONE OS EXCEPTION TEST: triggering invalid opcode" \
            "invalid opcode" \
            "0x0000000000000006" \
            "no" \
            ""
          verify_exception_case \
            image-test-general-protection \
            one-os-general-protection-test-bios.img \
            "ONE OS EXCEPTION TEST: triggering general protection fault" \
            "general protection fault" \
            "0x000000000000000d" \
            "yes" \
            ""
          verify_exception_case \
            image-test-page-fault \
            one-os-page-fault-test-bios.img \
            "ONE OS EXCEPTION TEST: triggering page fault" \
            "page fault" \
            "0x000000000000000e" \
            "yes" \
            "0x0000400000000000"
