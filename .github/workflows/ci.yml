name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-and-test:
    name: Format, test, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run core tests
        run: cargo test -p oneos-core

      - name: Lint core crate
        run: cargo clippy -p oneos-core --all-targets -- -D warnings

      - name: Check bare-metal kernel
        run: cargo check -p one-os-kernel --target x86_64-unknown-none
