name: CI

on:
  # Required PR validation runs for each candidate, including every new head commit.
  # workflow_dispatch is for diagnostics; it is not a substitute for the PR-context check.
  #
  # Merge protection is enforced by GitHub's active "Protect main" ruleset, not by
  # these comments. The ruleset must require the named CI check, strict up-to-date checks,
  # with review threads resolved. Required approving reviews are intentionally zero while
  # this is a single-maintainer repository; requiring one would block self-authored PR merges.
  # Raise that threshold only after an independent reviewer is available. Rulesets are GitHub-side settings, not YAML.
  #
  # Verification before merge: ensure the required check is green for the latest PR HEAD
  # and the branch is up to date with main. workflow_dispatch runs are diagnostic only;
  # do not treat a run from an older SHA or a non-PR event as approval of the current HEAD.
  # The job name below is a contract with the Protect main ruleset; update both if renamed.
  # Docs:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  # https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate event types so workflow_dispatch on a PR branch cannot cancel its
  # required PR-context run. Within the same event type, newer PR runs still replace
  # older ones for that head branch; repository qualification avoids fork collisions.
  group: one-os-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format-and-test:
    name: Format, test, lint, and boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep this guest profile synchronized with docs/engineering/VERIFICATION.md.
      QEMU_MACHINE: pc-i440fx-8.2,accel=tcg
      QEMU_CPU: qemu64,+nx
      QEMU_SMP: "1"
      QEMU_MEMORY: 128M
      # Regression test for custom target directories used by oneos-xtask.
      CARGO_TARGET_DIR: /tmp/one-os-target
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned upstream master snapshot; no matching release tag
        with:
          toolchain: nightly-2026-10-22
          components: rustfmt, clippy, llvm-tools-preview, rust-src
          targets: x86_64-unknown-none

      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y qemu-system-x86

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run core tests
        run: cargo test --locked -p oneos-core

      - name: Lint core crate
        run: cargo clippy --locked -p oneos-core --all-targets -- -D warnings

      - name: Lint bare-metal kernel
        run: cargo clippy --locked -p one-os-kernel --target x86_64-unknown-none -- -D warnings

      - name: Lint build tool
        run: cargo clippy --locked -p oneos-xtask --all-targets -- -D warnings

      - name: Check bare-metal kernel
        run: cargo check --locked -p one-os-kernel --target x86_64-unknown-none

      - name: Test CR3 assembly validator
        run: python3 -m unittest discover -s tools/ci -p 'test_check_cr3_assembly.py'

      - name: Test CR3 source policy
        run: python3 -m unittest discover -s tools/ci -p 'test_check_cr3_source_policy.py'

      - name: Validate CR3 source inventory
        run: python3 tools/ci/check_cr3_source_policy.py --root .

      - name: Inspect optimized CR3 switch assembly
        shell: bash
        run: |
          # Keep release optimization enabled; disable only LTO for readable pre-link assembly.
          asm_target_dir="$RUNNER_TEMP/one-os-assembly-target"
          rm -rf "$asm_target_dir"
          CARGO_TARGET_DIR="$asm_target_dir" cargo rustc --locked --release -p one-os-kernel \
            --target x86_64-unknown-none -- -C lto=no --emit=asm

          # Check the actual optimized activation function and retain the CR3 memory barrier.
          python3 tools/ci/check_cr3_assembly.py \
            --assembly-dir "$asm_target_dir" \
            --source kernel/src/address_space.rs

      - name: Build BIOS image
        run: cargo run --locked -p oneos-xtask -- image

      - name: Test QEMU serial-log validator
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Verify kernel startup in QEMU (three independent boots)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "QEMU boot attempt ${attempt}/3"
            log="$CARGO_TARGET_DIR/qemu-serial-${attempt}.log"
            set +e
            timeout 30s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
              -drive format=raw,file="$CARGO_TARGET_DIR/one-os-bios.img" \
              -serial stdio -display none -no-reboot -no-shutdown \
              > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            python3 tools/ci/check_qemu_serial.py \
              --log "$log" \
              --exit-status "$status" \
              --require-large-page-demotion-smoke
            grep -Fq "ONE OS KERNEL W^X DIRECT-MAP TRANSITION PASS" "$log"
          done

      - name: Verify unregistered root rejection in the real initial CR3 activation path
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-cr3-activation-guard
          log="$CARGO_TARGET_DIR/qemu-cr3-activation-guard.log"
          set +e
          timeout 60s qemu-system-x86_64 \
            -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-cr3-activation-guard-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          grep -Fq "ONE OS CR3 INITIAL ACTIVATION UNREGISTERED ROOT REJECT PASS" "$log"
          if grep -Fq "ONE OS CR3 INITIAL ACTIVATION UNREGISTERED ROOT REJECT FAIL" "$log"; then
            echo "initial CR3 activation rejection test reported failure" >&2
            exit 1
          fi
          test "$status" -eq 33

      - name: Verify unregistered target rejection in the real CR3 switch path
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-cr3-switch-guard
          log="$CARGO_TARGET_DIR/qemu-cr3-switch-guard.log"
          set +e
          timeout 60s qemu-system-x86_64 \
            -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-cr3-switch-guard-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          grep -Fq "ONE OS CR3 SWITCH UNREGISTERED ROOT REJECT PASS" "$log"
          if grep -Fq "ONE OS CR3 SWITCH UNREGISTERED ROOT REJECT FAIL" "$log"; then
            echo "runtime CR3 switch rejection test reported failure" >&2
            exit 1
          fi
          test "$status" -eq 33

      - name: Verify permanently reserved target rejection in the real CR3 switch path
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-cr3-reserved-root-guard
          log="$CARGO_TARGET_DIR/qemu-cr3-reserved-root-guard.log"
          set +e
          timeout 60s qemu-system-x86_64 \
            -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-cr3-reserved-root-guard-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          grep -Fq "ONE OS CR3 SWITCH PERMANENTLY RESERVED ROOT REJECT PASS" "$log"
          if grep -Fq "ONE OS CR3 SWITCH PERMANENTLY RESERVED ROOT REJECT FAIL" "$log"; then
            echo "permanently reserved target rejection test reported failure" >&2
            exit 1
          fi
          test "$status" -eq 33

      - name: Verify post-activation W^X audit diagnostics in QEMU
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-wx-runtime-audit
          log="$CARGO_TARGET_DIR/qemu-wx-runtime-audit.log"
          set +e
          timeout 60s qemu-system-x86_64 \
            -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-wx-runtime-audit-test-bios.img" \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          python3 tools/ci/check_qemu_serial.py \
            --log "$log" \
            --exit-status "$status"
          grep -Fq "ONE OS W^X RUNTIME AUDIT COMPLETE FOR DECLARED SCOPE (READ-ONLY; NORMAL BOOT FAILS CLOSED ON CONFLICT)" "$log"
          grep -Fq "ONE OS W^X RUNTIME CONFLICT EVENTS: 0x0000000000000000" "$log"
          grep -Fq "ONE OS W^X RUNTIME AUDIT OBSERVED NO CONFLICTS IN DECLARED SCOPE" "$log"
          grep -Fq "ONE OS W^X RUNTIME ACTIVE ROOT:" "$log"
          grep -Fq "ONE OS KERNEL W^X PREFLIGHT LATE-FAILURE NO-MUTATION PASS" "$log"
          grep -Fq "ONE OS KERNEL W^X DIRECT-MAP PREFLIGHT PASS" "$log"
          grep -Fq "ONE OS KERNEL W^X DIRECT-MAP TRANSITION PASS" "$log"
          grep -Fq "ONE OS W^X SIBLING PRE-DEMOTION LARGE PAGE PASS" "$log"
          grep -Fq "ONE OS W^X LARGE-PAGE DEMOTION VERIFIED PASS" "$log"
          grep -Fq "ONE OS W^X DIRECT-MAP WRITE FAULT MATCHED" "$log"
          grep -Fq "ONE OS W^X DIRECT-MAP WRITE PROTECTION PASS" "$log"
          grep -Fq "ONE OS W^X WRITABLE SIBLING DIRECT-MAP PASS" "$log"
          grep -Fq "ONE OS W^X SIBLING ALIAS DATA CONSISTENCY PASS" "$log"
          grep -Fq "ONE OS W^X LIVE ROOT UNREGISTER REJECT PASS" "$log"
          grep -Fq "ONE OS W^X UNALLOCATED ROOT REGISTRATION REJECT PASS" "$log"
          grep -Fq "ONE OS W^X PERMANENTLY RESERVED ROOT REGISTRATION REJECT PASS" "$log"
          grep -Fq "ONE OS W^X PERMANENTLY RESERVED ROOT AUDIT REJECT PASS" "$log"
          grep -Fq "ONE OS W^X DUPLICATE ROOT REGISTRATION REJECT PASS" "$log"
          grep -Fq "ONE OS W^X MISSING ROOT REGISTRATION GUARD REJECT PASS" "$log"
          grep -Fq "ONE OS W^X CROSS-ROOT ALIAS CONFLICT DETECTION PASS" "$log"
          grep -Fq "ONE OS W^X CROSS-ROOT ALIAS RESTORE PASS" "$log"
          python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          log = Path(sys.argv[1]).read_text()
          def parse_unique_hex(label):
              matches = re.findall(rf"^{re.escape(label)}(0x[0-9a-fA-F]+)$", log, re.MULTILINE)
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one diagnostic for {label!r}")
              return int(matches[0], 16)

          original_page_size = parse_unique_hex("ONE OS W^X SIBLING ORIGINAL DIRECT-MAP LARGE PAGE: ")
          executable_physical_page = parse_unique_hex("ONE OS W^X TEST EXECUTABLE PHYSICAL PAGE: ")
          sibling_physical_page = parse_unique_hex("ONE OS W^X SIBLING DATA FRAME PHYSICAL: ")
          if original_page_size not in (1 << 21, 1 << 30):
              raise SystemExit("expected original 2 MiB or 1 GiB direct-map leaf")
          if executable_physical_page == sibling_physical_page:
              raise SystemExit("W^X sibling frame aliases the executable physical frame")
          if (executable_physical_page & ~((1 << 21) - 1)) != (sibling_physical_page & ~((1 << 21) - 1)):
              raise SystemExit("W^X sibling frame is not in the executable page's 2 MiB physical region")
          markers = [
              "ONE OS W^X SIBLING PRE-DEMOTION LARGE PAGE PASS",
              "ONE OS KERNEL W^X PREFLIGHT LATE-FAILURE NO-MUTATION PASS",
              "ONE OS KERNEL W^X DIRECT-MAP PREFLIGHT PASS",
              "ONE OS KERNEL W^X DIRECT-MAP TRANSITION PASS",
              "ONE OS W^X DIRECT-MAP WRITE PROTECTION PASS",
              "ONE OS W^X LARGE-PAGE DEMOTION VERIFIED PASS",
              "ONE OS W^X WRITABLE SIBLING DIRECT-MAP PASS",
              "ONE OS W^X SIBLING ALIAS DATA CONSISTENCY PASS",
          ]
          positions = [log.find(marker) for marker in markers]
          if any(position < 0 for position in positions) or positions != sorted(positions):
              raise SystemExit("W^X large-page precondition, transition, and sibling test markers are missing or out of order")
          print("W^X large-page sibling regression sequence validated")
          PY

      - name: Verify uncertain-CR3 root token leak policy in QEMU
        shell: bash
        run: |
          # Root activation/teardown smoke checks need more than the normal-boot budget;
          # the serial validator still requires the exact pass marker and clean bootstrap completion.
          cargo run --locked -p oneos-xtask -- image-test-root-leak-safety
          log="$CARGO_TARGET_DIR/qemu-root-leak-safety.log"
          set +e
          timeout 60s qemu-system-x86_64 \
            -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-root-leak-safety-test-bios.img" \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          grep -Fq "ONE OS ROOT LEAK SAFETY PASS" "$log"
          python3 tools/ci/check_qemu_serial.py \
            --log "$log" \
            --exit-status "$status"

      - name: Verify exception diagnostics in QEMU
        shell: bash
        run: |
          verify_exception_case() {
            local command="$1"
            local image="$2"
            local case_name="$3"
            local log="$CARGO_TARGET_DIR/$command.log"

            cargo run --locked -p oneos-xtask -- "$command"
            set +e
            timeout 10s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
              -drive format=raw,file="$CARGO_TARGET_DIR/$image" \
              -serial stdio -display none -no-reboot -no-shutdown \
              > "$log" 2>&1
            local status=$?
            set -e
            cat "$log"

            python3 tools/ci/check_qemu_exception.py \
              --log "$log" \
              --exit-status "$status" \
              --case "$case_name"
          }

          verify_exception_case image-test-exception one-os-exception-test-bios.img ud
          verify_exception_case image-test-general-protection one-os-general-protection-test-bios.img gp
          verify_exception_case image-test-page-fault one-os-page-fault-test-bios.img pf
          verify_exception_case image-test-double-fault one-os-double-fault-test-bios.img df

      - name: Verify NMI and machine-check IST stack selection in QEMU
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-ist
          log="$CARGO_TARGET_DIR/qemu-ist-stacks.log"
          set +e
          timeout 10s qemu-system-x86_64 \
            -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-ist-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          python3 tools/ci/check_qemu_ist.py \
            --log "$log" \
            --exit-status "$status"

      - name: Verify real NMI during W^X break-before-make in QEMU
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-nmi-wx-transition
          python3 tools/ci/run_qemu_nmi_wx_transition.py \
            --image "$CARGO_TARGET_DIR/one-os-nmi-wx-transition-test-bios.img" \
            --log "$CARGO_TARGET_DIR/qemu-nmi-wx-transition.log" \
            --machine "$QEMU_MACHINE" \
            --cpu "$QEMU_CPU" \
            --smp "$QEMU_SMP" \
            --memory "$QEMU_MEMORY"

      - name: Verify supervisor write protection in QEMU
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-supervisor-write-protection
          log="$CARGO_TARGET_DIR/qemu-supervisor-write-protection.log"
          set +e
          timeout 10s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-supervisor-write-protection-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          python3 tools/ci/check_qemu_vm_protection.py \
            --log "$log" \
            --exit-status "$status" \
            --case supervisor-write-protection

      - name: Verify NX instruction-fetch protection in QEMU
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-nx-protection
          log="$CARGO_TARGET_DIR/qemu-nx-instruction-fetch.log"
          set +e
          timeout 10s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-nx-protection-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          python3 tools/ci/check_qemu_vm_protection.py \
            --log "$log" \
            --exit-status "$status" \
            --case nx-instruction-fetch

      - name: Verify map/unmap/remap and TLB transitions in QEMU
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-vm-transitions
          log="$CARGO_TARGET_DIR/qemu-vm-transitions.log"
          set +e
          timeout 10s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-vm-transitions-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          python3 tools/ci/check_qemu_vm_transitions.py \
            --log "$log" \
            --exit-status "$status"

      - name: Upload QEMU serial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-os-qemu-serial-logs
          path: /tmp/one-os-target/*.log
          if-no-files-found: warn
          retention-days: 14
