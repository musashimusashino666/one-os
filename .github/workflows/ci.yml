name: CI

on:
  # Required PR validation runs for each candidate, including every new head commit.
  # workflow_dispatch is for diagnostics; it is not a substitute for the PR-context check.
  #
  # Merge protection is enforced by GitHub's active "Protect main" ruleset, not by
  # these comments. The ruleset must require the named CI check, strict up-to-date checks,
  # with review threads resolved. Required approving reviews are intentionally zero while
  # this is a single-maintainer repository; requiring one would block self-authored PR merges.
  # Raise that threshold only after an independent reviewer is available. Rulesets are GitHub-side settings, not YAML.
  #
  # Verification before merge: ensure the required check is green for the latest PR HEAD
  # and the branch is up to date with main. workflow_dispatch runs are diagnostic only;
  # do not treat a run from an older SHA or a non-PR event as approval of the current HEAD.
  # The job name below is a contract with the Protect main ruleset; update both if renamed.
  # Docs:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  # https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate event types so workflow_dispatch on a PR branch cannot cancel its
  # required PR-context run. Within the same event type, newer PR runs still replace
  # older ones for that head branch; repository qualification avoids fork collisions.
  group: one-os-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  format-and-test:
    name: Format, test, lint, and boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep this guest profile synchronized with docs/ISOLATION_PLAN.md.
      QEMU_MACHINE: pc-i440fx-8.2,accel=tcg
      QEMU_CPU: qemu64,+nx
      QEMU_SMP: "1"
      QEMU_MEMORY: 128M
      # Regression test for custom target directories used by oneos-xtask.
      CARGO_TARGET_DIR: /tmp/one-os-target
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned upstream master snapshot; no matching release tag
        with:
          toolchain: nightly-2026-10-22
          components: rustfmt, clippy, llvm-tools-preview, rust-src
          targets: x86_64-unknown-none

      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y qemu-system-x86

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run core tests
        run: cargo test --locked -p oneos-core

      - name: Lint core crate
        run: cargo clippy --locked -p oneos-core --all-targets -- -D warnings

      - name: Lint bare-metal kernel
        run: cargo clippy --locked -p one-os-kernel --target x86_64-unknown-none -- -D warnings

      - name: Lint build tool
        run: cargo clippy --locked -p oneos-xtask --all-targets -- -D warnings

      - name: Check bare-metal kernel
        run: cargo check --locked -p one-os-kernel --target x86_64-unknown-none

      - name: Inspect optimized CR3 switch assembly
        shell: bash
        run: |
          # Keep release optimization enabled while emitting pre-link assembly.
          # LTO is disabled only for this assembly inspection so rustc can emit
          # a readable .s file; opt-level=3 and the release codegen settings remain.
          cargo rustc --locked --release -p one-os-kernel \
            --target x86_64-unknown-none -- -C lto=no --emit=asm
          asm_dir="$CARGO_TARGET_DIR/x86_64-unknown-none/release/deps"
          asm_file="$(find "$asm_dir" -maxdepth 1 -type f -name 'one_os_kernel-*.s' -print -quit)"
          if [[ -z "$asm_file" ]]; then
            echo "Optimized kernel assembly was not emitted in $asm_dir" >&2
            exit 1
          fi
          echo "Inspecting CR3-related instructions in $asm_file"
          if ! grep -ni -B 80 -A 60 'cr3' "$asm_file"; then
            echo "No CR3 references found in optimized kernel assembly" >&2
            exit 1
          fi

      - name: Build BIOS image
        run: cargo run --locked -p oneos-xtask -- image

      - name: Test QEMU serial-log validator
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Verify kernel startup in QEMU (three independent boots)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "QEMU boot attempt ${attempt}/3"
            log="$CARGO_TARGET_DIR/qemu-serial-${attempt}.log"
            set +e
            timeout 10s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
              -drive format=raw,file="$CARGO_TARGET_DIR/one-os-bios.img" \
              -serial stdio -display none -no-reboot -no-shutdown \
              > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            python3 tools/check_qemu_serial.py \
              --log "$log" \
              --exit-status "$status"
          done

      - name: Verify exception diagnostics in QEMU
        shell: bash
        run: |
          verify_exception_case() {
            local command="$1"
            local image="$2"
            local case_name="$3"
            local log="$CARGO_TARGET_DIR/$command.log"

            cargo run --locked -p oneos-xtask -- "$command"
            set +e
            timeout 10s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
              -drive format=raw,file="$CARGO_TARGET_DIR/$image" \
              -serial stdio -display none -no-reboot -no-shutdown \
              > "$log" 2>&1
            local status=$?
            set -e
            cat "$log"

            python3 tools/check_qemu_exception.py \
              --log "$log" \
              --exit-status "$status" \
              --case "$case_name"
          }

          verify_exception_case image-test-exception one-os-exception-test-bios.img ud
          verify_exception_case image-test-general-protection one-os-general-protection-test-bios.img gp
          verify_exception_case image-test-page-fault one-os-page-fault-test-bios.img pf
          verify_exception_case image-test-double-fault one-os-double-fault-test-bios.img df

      - name: Verify supervisor write protection in QEMU
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-supervisor-write-protection
          log="$CARGO_TARGET_DIR/qemu-supervisor-write-protection.log"
          set +e
          timeout 10s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-supervisor-write-protection-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          python3 tools/check_qemu_vm_protection.py \
            --log "$log" \
            --exit-status "$status" \
            --case supervisor-write-protection

      - name: Verify NX instruction-fetch protection in QEMU
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-nx-protection
          log="$CARGO_TARGET_DIR/qemu-nx-instruction-fetch.log"
          set +e
          timeout 10s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-nx-protection-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          python3 tools/check_qemu_vm_protection.py \
            --log "$log" \
            --exit-status "$status" \
            --case nx-instruction-fetch

      - name: Verify map/unmap/remap and TLB transitions in QEMU
        shell: bash
        run: |
          cargo run --locked -p oneos-xtask -- image-test-vm-transitions
          log="$CARGO_TARGET_DIR/qemu-vm-transitions.log"
          set +e
          timeout 10s qemu-system-x86_64 \
              -machine "$QEMU_MACHINE" -cpu "$QEMU_CPU" -smp "$QEMU_SMP" -m "$QEMU_MEMORY" \
            -drive format=raw,file="$CARGO_TARGET_DIR/one-os-vm-transitions-test-bios.img" \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            -serial stdio -display none -no-reboot -no-shutdown \
            > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          python3 tools/check_qemu_vm_transitions.py \
            --log "$log" \
            --exit-status "$status"

      - name: Upload QEMU serial logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: one-os-qemu-serial-logs
          path: /tmp/one-os-target/*.log
          if-no-files-found: warn
          retention-days: 14
